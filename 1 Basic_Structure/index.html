<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My First Page</title>
</head>
<body>
  <h1>Hello World!</h1>
  <p>This is my first HTML page.</p>
</body>
</html>

<!-- Every HTML document follows a standard structure defined by W3C. 
It begins with a <!DOCTYPE html> declaration, followed by the <html> root element, <head> for metadata, and <body> for visible content. 
This ensures interoperability across browsers. -->
